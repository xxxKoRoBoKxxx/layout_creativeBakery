<!-- #region head -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Title</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <!-- #endregion -->
  <body>
    <header class="header">
      <a
        class="header__logo-link"
        href="#"
      >
        <img
          src="./images/icons/logo.png"
          alt="Bakery logo"
          class="header__logo"
        />
      </a>
      <a class="icon" href="#menu">
        <img
          src="./images/icons/icon-menu-black.png"
          alt="Menu icon"
          class="icon"
        />
      </a>
    </header>
    <section class="hero-block container page-grid">
      <p class="hero-block__text body-text">
        We bake your fantasies — croissants, cakes, cookies, and cupcakes.
      </p>
      <h1 class="hero-block__title heading-h1">Creative bakery</h1>
      <img
        src="images/Cookie.png"
        alt="Cookie"
        class="hero-block__big-cookie"
      />
      <a
        href="#"
        class="hero-block__button-link button"
      >
        <img
          src="images/icons/icon-cookie.png"
          alt="cookie"
          class="button__img"
        />
        <span class="uppercase">Learn more</span>
      </a>
    </section>
    <aside class="aside-menu" id="menu">
      <header class="aside-menu__top header">
        <a
          class="header__logo-link"
          href="#"
        >
          <img
            src="./images/icons/logo.png"
            alt="Bakery logo"
            class="header__logo"
          />
        </a>
        <a class="icon" href="#">
          <img
            src="./images/icons/icon-close-black.png"
            alt="Close icon"
            class="icon"
          />
        </a>
      </header>
      <div class="aside-menu__menu menu container">
        <p class="menu__item body-text">Products</p>
        <p class="menu__item body-text">About Us</p>
        <p class="menu__item body-text">Blog</p>
        <p class="menu__item uppercase">
          <img
            src="./images/icons/icon-phone.png"
            alt="Phone"
            class="icon"
          >
          <span>Contact us</span>
        </p>
      </div>
    </aside>
    <script src="scripts/main.js"></script>
  </body>
</html>
